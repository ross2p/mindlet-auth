name: auth-ac-matrix

on:
  push:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=prisma/schema.prisma
      - run: npm test -- --testPathPattern=auth-ac-matrix|refresh-gate|password-reset.service|credentials.service|two-factor-methods|session.service.sign-out|auth-challenge|redis-throttler --coverage=false
