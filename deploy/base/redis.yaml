apiVersion: v1
kind: Service
metadata:
  name: auth-redis
  namespace: mindlet
  labels:
    mindlet.io/workload: auth
    app.kubernetes.io/part-of: mindlet
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/component: redis
    mindlet.io/workload: auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-redis
  namespace: mindlet
  labels:
    mindlet.io/workload: auth
    app.kubernetes.io/part-of: mindlet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
      mindlet.io/workload: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis
        mindlet.io/workload: auth
        app.kubernetes.io/part-of: mindlet
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
