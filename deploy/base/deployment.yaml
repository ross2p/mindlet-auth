apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth
  namespace: mindlet
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: mindlet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: mindlet
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: mindlet
    mindlet.io/network-policy: default-deny-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/part-of: mindlet
        mindlet.io/network-policy: default-deny-ingress
    spec:
      serviceAccountName: auth
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command: ["sh","-c","until pg_isready -h auth-postgres -U mindlet; do sleep 2; done"]
        - name: wait-redis
          image: redis:7-alpine
          command: ["sh","-c","until redis-cli -h auth-redis ping; do sleep 2; done"]
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: mindlet-auth:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: platform-config
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
