apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: mindlet
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: mindlet
type: Opaque
stringData:
  SWAGGER_USER: admin
  SWAGGER_PASSWORD: admin
  SENTRY_DSN: https://example.com/placeholder
  DATABASE_URL: postgresql://mindlet:mindlet@auth-postgres:5432/mindlet_auth
  REDIS_URL: redis://auth-redis:6379/0
  TWO_FACTOR_ENCRYPTION_KEY: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
